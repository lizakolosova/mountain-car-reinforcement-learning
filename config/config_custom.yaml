environment: "MountainCarContinuous-v0"
algorithm: "SAC"
num_trials: 3
timesteps: 200000 # I used 40 000 but you can use this one
checkpoint_freq: 10000

reward_shaping:
  position_scale: 20.0
  velocity_scale: 12.0
  height_scale: 25.0
  energy_penalty_scale: 0.02
  goal_bonus: 1000.0

  time_penalty: 0.5
  near_goal_threshold: 0.20
  near_goal_scale: 500.0
