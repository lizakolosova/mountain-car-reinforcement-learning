environment: "MountainCarContinuous-v0"
algorithm: "SAC"
num_trials: 3
timesteps: 200000
checkpoint_freq: 10000

reward_shaping:
  position_scale: 1.5
  velocity_scale: 0.5
  height_scale: 1.0
  energy_penalty_scale: 0.02
  goal_bonus: 20.0

  time_penalty: 0.01
  near_goal_threshold: 0.35
  near_goal_scale: 5.0
